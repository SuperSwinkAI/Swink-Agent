[package]
autotests = false
name = "swink-agent-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Interactive terminal UI for swink-agent"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["tui", "terminal", "llm", "agent", "chat"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "swink_agent_tui"
path = "src/lib.rs"

[[bin]]
name = "swink"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
swink-agent = { path = "..", version = "0.14.1", default-features = false }
swink-agent-adapters = { path = "../adapters", version = "0.14.1", default-features = false, features = ["anthropic", "openai", "ollama", "proxy"], optional = true }
swink-agent-memory = { path = "../memory", version = "0.14.1" }
swink-agent-local-llm = { path = "../local-llm", version = "0.14.1", optional = true }
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "html", "regex-fancy"] }
futures.workspace = true
arboard = "3.6.1"
toml.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
keyring.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing-appender.workspace = true
dotenvy.workspace = true
thiserror.workspace = true
tempfile.workspace = true
serde_yaml_ng = { workspace = true, optional = true }

[features]
default = ["cli", "builtin-tools", "transfer"]
cli = ["adapters"]
# Forward root local-execution features. Remote-only consumers (e.g.
# `swink-agent-tui-remote`) disable TUI defaults to keep them off.
builtin-tools = ["swink-agent/builtin-tools"]
transfer = ["swink-agent/transfer"]
adapters = ["dep:swink-agent-adapters"]
full = ["local", "cli", "builtin-tools", "transfer"]
local = ["dep:swink-agent-local-llm"]
# Filesystem-backed skills discovery (`TuiExtensions::with_skill_dirs`).
skills = ["dep:serde_yaml_ng"]

[[example]]
name = "custom_agent"
required-features = ["cli", "builtin-tools"]

[dev-dependencies]
swink-agent = { path = "..", default-features = false, features = ["testkit"] }
tokio-util.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
