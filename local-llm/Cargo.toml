[package]
autotests = false
name = "swink-agent-local-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Local on-device LLM inference for swink-agent using llama.cpp"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["llm", "local", "inference", "gguf", "embedding"]
categories = ["development-tools", "science"]

[package.metadata.docs.rs]
features = ["gemma4"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
gemma4 = []
metal = ["llama-cpp-2/metal"]
cuda = ["llama-cpp-2/cuda"]
cudnn = ["cuda"]
vulkan = ["llama-cpp-2/vulkan"]

[dependencies]
swink-agent = { path = "..", version = "0.14.1", default-features = false }
llama-cpp-2 = "0.1.154"
# Model downloads talk to the Hugging Face Hub directly (src/download.rs) on
# the workspace reqwest + rustls(ring) stack. hf-hub 1.0 was dropped: it
# hard-depends on hf-xet, whose default feature hardwires aws-lc-rs — a
# cmake C build — and no feature flag on our side can turn that off.
reqwest.workspace = true
rustls.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "fs", "io-util"] }
tokio-util.workspace = true
tokio-stream.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
swink-agent = { path = "..", default-features = false, features = ["testkit"] }
tokio = { workspace = true, features = ["full", "test-util"] }
pretty_assertions.workspace = true
tempfile.workspace = true
wiremock.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"

[[test]]
name = "no_default_features"
path = "tests/no_default_features.rs"
