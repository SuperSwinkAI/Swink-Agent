name: Mutants

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

jobs:
  mutants:
    runs-on: ubuntu-latest
    # cargo-mutants rebuilds and re-tests the workspace per mutant, so a full
    # run takes hours — but it must not sit on the 360-minute GitHub default
    # when wedged.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: mutants
      - uses: cargo-bins/cargo-binstall@81df5c23b0dc775b009efdfc9895c5965b7a4e40 # v1.26.1
      - run: cargo binstall --no-confirm cargo-mutants
      - run: cargo mutants --workspace
